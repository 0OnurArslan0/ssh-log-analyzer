[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ssh-log-analyzer"
version = "0.1.0"
description = "Detect SSH brute-force attacks in auth.log via sliding-window analysis"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
ssh-log-analyzer = "sshloganalyzer.cli:main"
ssh-log-gen-sample = "sshloganalyzer.sample_generator:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
